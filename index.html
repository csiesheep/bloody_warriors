<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1116">
<title>一騎當前 bloody_warriors (M1.5)</title>
<link rel="icon" href="favicon.svg">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1116; }
  body {
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #c { width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; color: #fff;
    font: 13px/1.5 system-ui, sans-serif;
    background: rgba(0, 0, 0, .45); padding: 6px 10px; border-radius: 6px;
    pointer-events: none;
  }
  #probe {
    position: fixed; inset: 0; margin: 0; background: #000; color: #9f9;
    font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; z-index: 9;
  }
  #combo {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 18px; color: #ffd23f;
    font: 700 22px system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
    pointer-events: none;
  }
  /* M1.5 虛擬按鍵(issue #2):iPhone 觸控;桌面由 main.ts 依 pointer:coarse 決定顯示 */
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #joy {
    position: absolute;
    left: calc(24px + env(safe-area-inset-left));
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 112px; height: 112px; border-radius: 50%;
    background: rgba(255, 255, 255, .12); border: 2px solid rgba(255, 255, 255, .35);
    pointer-events: auto; touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(255, 255, 255, .5);
  }
  #atk {
    position: absolute;
    right: calc(24px + env(safe-area-inset-right));
    bottom: calc(40px + env(safe-area-inset-bottom));
    width: 88px; height: 88px; border-radius: 50%; border: none; padding: 0;
    background: rgba(255, 210, 63, .25); color: #ffd23f;
    font: 700 20px system-ui, sans-serif;
    pointer-events: auto; touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">M1.5 · WASD 移動 · 滑鼠指向 · 左鍵/J 普攻(三段)<br>一騎當前 bloody_warriors</div>
<div id="combo"></div>
<pre id="probe" hidden></pre>
<div id="touch" hidden>
  <div id="joy"><div id="knob"></div></div>
  <button id="atk" type="button">斬</button>
</div>
<script type="module" src="/src/game/main.ts"></script>
</body>
</html>
